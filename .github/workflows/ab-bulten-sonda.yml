# GEÇİCİ SONDA: AB Haftalık Petrol Bülteni'nin veri dosyasını bulup içeriğini
# raporlar (hangi ülkeler var, Türkiye kapsamda mı, hangi yakıt türleri).
# Sorunun cevabı alınınca bu iş akışı ve betiği SİLİNECEK.
name: ab-bulten-sonda

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/ab-bulten-sonda.py'
      - '.github/workflows/ab-bulten-sonda.yml'

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Bülteni sorgula
        run: python tools/ab-bulten-sonda.py
