# Tek seferlik doğrulama: county=1000 gerçekten Çankaya mı?
# Bugünün fiyatını ilçe ilçe yazdırır; elle bilinen bir değerle karşılaştırmak için.
name: sonda-cankaya
on: workflow_dispatch
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/sonda-cankaya.py
